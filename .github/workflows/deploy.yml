name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 20m
          script: |
            set -e
            cd /root/Guest-Flow-Pro

            echo ">>> Pulling latest code..."
            git pull origin main

            echo ">>> Updating backend..."
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt --quiet
            python manage.py migrate --no-input
            python manage.py collectstatic --no-input
            deactivate
            cd ..
            # Managed by systemd (guestflowpro-api.service), not a raw daemonized
            # process — avoids the pkill/respawn gap that dropped every request
            # in flight during a deploy. `reload` re-execs gunicorn workers one
            # at a time (SIGHUP) without ever closing the listening socket; if
            # the unit doesn't define ExecReload yet, this falls back to a
            # normal (brief) restart instead of failing the deploy.
            sudo systemctl reload guestflowpro-api.service || sudo systemctl restart guestflowpro-api.service

            echo ">>> Building frontend..."
            npm install --silent
            npm run build

            echo ">>> Restarting frontend..."
            pm2 reload guestflowpro --update-env

            echo ">>> Deploy complete!"
