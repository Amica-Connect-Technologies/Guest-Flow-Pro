name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd /root/Guest-Flow-Pro
          git pull origin main

      - name: Install dependencies
        run: |
          cd /root/Guest-Flow-Pro
          npm install

      - name: Build
        run: |
          cd /root/Guest-Flow-Pro
          npm run build

      - name: Restart app
        run: pm2 reload guestflowpro
